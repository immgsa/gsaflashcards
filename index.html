<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSA Flashcard Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1em;
        }

        /* Loading Section */
        .loading-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 400px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #667eea;
            font-size: 1.2em;
            font-weight: 600;
        }

        /* Begin Quiz Button */
        .begin-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .begin-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .begin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .begin-button:active {
            transform: translateY(0);
        }

        /* Upload Section */
        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .upload-area small {
            color: #999;
            display: block;
        }

        #fileInput {
            display: none;
        }

        /* Module Selection */
        .module-selection {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .module-selection h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-input::placeholder {
            color: #999;
        }

        /* Module List */
        .module-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        /* Scrollbar Styling */
        .module-list::-webkit-scrollbar {
            width: 8px;
        }

        .module-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .module-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .module-list::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .module-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
        }

        .module-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .module-item.selected {
            border-color: #4ecdc4;
            background: #e8f9f7;
        }

        .module-item.hidden {
            display: none;
        }

        .module-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .module-name {
            color: #333;
            font-weight: 600;
            font-size: 1em;
        }

        .module-count {
            color: #999;
            font-size: 0.85em;
        }

        .module-status {
            font-size: 1.5em;
            transition: all 0.2s ease;
            min-width: 40px;
            text-align: right;
        }

        .module-item:hover .module-status {
            transform: scale(1.15);
        }

        /* Select All Buttons */
        .select-all-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .select-btn {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .select-all-btn {
            background: #4ecdc4;
            color: white;
        }

        .select-all-btn:hover {
            background: #45b8ad;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.3);
        }

        .deselect-all-btn {
            background: #ff6b6b;
            color: white;
        }

        .deselect-all-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .selection-counter {
            text-align: center;
            color: #667eea;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Quiz Section */
        .quiz-section {
            display: none;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-header h2 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .selected-modules {
            color: #999;
            font-size: 0.85em;
            margin-top: 10px;
            max-height: 60px;
            overflow-y: auto;
            background: #f8f9ff;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }

        /* Flashcard */
        .flashcard-container {
            perspective: 1000px;
            margin: 40px 0;
            height: 300px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: 500;
            text-align: center;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            word-wrap: break-word;
            overflow-y: auto;
        }

        .flashcard-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .flashcard-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .flip-hint {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.8em;
            opacity: 0.8;
            font-style: italic;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .reset-button {
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .reset-button:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .shuffle-button {
            background: #4ecdc4;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .shuffle-button:hover {
            background: #45b8ad;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .flashcard-face {
                font-size: 1.1em;
                padding: 20px;
            }

            .flashcard-container {
                height: 250px;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                width: 100%;
            }

            .module-item {
                flex-wrap: wrap;
            }

            .module-list {
                max-height: 300px;
            }
        }

        /* Error Message */
        .error-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 GSA Flashcard Quiz</h1>
            <p>Master your knowledge with interactive flashcards</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Upload Section -->
        <div id="uploadSection" class="upload-section">
            <div id="uploadArea" class="upload-area">
                <div class="upload-icon">📊</div>
                <p>Drop your Excel files here</p>
                <small>or click to browse (.xlsx, .xls)</small>
            </div>
            <input type="file" id="fileInput" multiple accept=".xlsx,.xls">
        </div>

        <!-- Loading Section -->
        <div id="loadingSection" class="loading-section" style="display: none;">
            <div class="spinner"></div>
            <div class="loading-text">Processing your Excel files...</div>
        </div>

        <!-- Module Selection Section -->
        <div id="moduleSelectionSection" style="display: none;">
            <div class="module-selection">
                <h3>📚 Select Sheets to Study</h3>
                
                <!-- Search Bar -->
                <div class="search-container">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="🔍 Search sheets..."
                    >
                </div>

                <!-- Selection Counter -->
                <div class="selection-counter" id="selectionCounter">0 sheets selected</div>

                <!-- Select/Deselect All Buttons -->
                <div class="select-all-buttons">
                    <button class="select-btn select-all-btn" id="selectAllBtn">✓ Select All</button>
                    <button class="select-btn deselect-all-btn" id="deselectAllBtn">✗ Deselect All</button>
                </div>

                <!-- Module List -->
                <div class="module-list" id="moduleList">
                    <div class="no-results">Loading sheets...</div>
                </div>
            </div>

            <div style="text-align: center;">
                <button id="beginButton" class="begin-button">Begin Quiz 🚀</button>
            </div>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection" class="quiz-section">
            <div class="quiz-header">
                <h2 id="cardNumber">Flashcard 1 of 1</h2>
                <div class="selected-modules" id="selectedModulesDisplay"></div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span id="progressText">0/0</span>
                </div>
            </div>

            <div class="flashcard-container" id="flashcardContainer">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-face flashcard-front">
                        <div>
                            <div id="frontContent">Front</div>
                            <div class="flip-hint">Click to flip</div>
                        </div>
                    </div>
                    <div class="flashcard-face flashcard-back">
                        <div>
                            <div id="backContent">Back</div>
                            <div class="flip-hint">Click to flip</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="prevBtn" class="btn btn-secondary">← Previous</button>
                <button id="nextBtn" class="btn btn-secondary">Next →</button>
            </div>

            <div class="action-buttons">
                <button id="shuffleBtn" class="shuffle-button">🔀 Shuffle Again</button>
                <button id="resetBtn" class="reset-button">↻ Reset & Upload New</button>
            </div>
        </div>
    </div>

    <!-- Include SheetJS for Excel parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>

    <script>
        // State Management
        let allFlashcards = {};
        let selectedModules = {};
        let activeFlashcards = [];
        let currentIndex = 0;
        let isFlipped = false;

        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadSection = document.getElementById('uploadSection');
        const loadingSection = document.getElementById('loadingSection');
        const moduleSelectionSection = document.getElementById('moduleSelectionSection');
        const moduleList = document.getElementById('moduleList');
        const searchInput = document.getElementById('searchInput');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        const selectionCounter = document.getElementById('selectionCounter');
        const beginButton = document.getElementById('beginButton');
        const quizSection = document.getElementById('quizSection');
        const flashcard = document.getElementById('flashcard');
        const frontContent = document.getElementById('frontContent');
        const backContent = document.getElementById('backContent');
        const cardNumber = document.getElementById('cardNumber');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const selectedModulesDisplay = document.getElementById('selectedModulesDisplay');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const flashcardContainer = document.getElementById('flashcardContainer');

        // Upload Area Click
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag & Drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(f => 
                f.name.endsWith('.xlsx') || f.name.endsWith('.xls')
            );
            processFiles(files);
        });

        // File Input Change
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files).filter(f => 
                f.name.endsWith('.xlsx') || f.name.endsWith('.xls')
            );
            processFiles(files);
        });

        // Process Excel Files
        async function processFiles(files) {
            if (files.length === 0) {
                showError('Please select Excel files (.xlsx or .xls)');
                return;
            }

            // Show loading screen
            uploadSection.style.display = 'none';
            loadingSection.style.display = 'flex';
            moduleSelectionSection.style.display = 'none';

            allFlashcards = {};
            selectedModules = {};

            for (const file of files) {
                await processExcelFile(file);
            }

            if (Object.keys(allFlashcards).length === 0) {
                showError('No valid flashcards found. Make sure Column A has front content and Column B has back content.');
                uploadSection.style.display = 'flex';
                loadingSection.style.display = 'none';
                return;
            }

            // Simulate 2-second processing
            await new Promise(resolve => setTimeout(resolve, 2000));

            // Show module selection
            showModuleSelection();
        }

        // Process Single Excel File
        function processExcelFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = (e) => {
                    try {
                        const data = e.target.result;
                        const workbook = XLSX.read(data, { type: 'array' });

                        // Process each sheet in the workbook
                        workbook.SheetNames.forEach(sheetName => {
                            const worksheet = workbook.Sheets[sheetName];
                            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                            const cards = [];
                            
                            // Skip header row if it exists (start from row 1)
                            for (let i = 1; i < jsonData.length; i++) {
                                const row = jsonData[i];
                                
                                if (row && row[0] && row[1]) {
                                    const front = String(row[0]).trim();
                                    const back = String(row[1]).trim();
                                    
                                    if (front && back) {
                                        cards.push({ front, back });
                                    }
                                }
                            }

                            if (cards.length > 0) {
                                allFlashcards[sheetName] = cards;
                                selectedModules[sheetName] = true;
                            }
                        });

                        resolve();
                    } catch (error) {
                        console.error('Error processing file:', error);
                        showError(`Error processing file: ${file.name}`);
                        resolve();
                    }
                };

                reader.readAsArrayBuffer(file);
            });
        }

        // Show Module Selection
        function showModuleSelection() {
            uploadSection.style.display = 'none';
            loadingSection.style.display = 'none';
            moduleSelectionSection.style.display = 'block';
            quizSection.style.display = 'none';
            updateModuleList();
            updateSelectionCounter();
        }

        // Update Module List Display
        function updateModuleList() {
            const searchTerm = searchInput.value.toLowerCase();
            const sheets = Object.keys(allFlashcards);
            let hasVisibleModules = false;

            const moduleHTML = sheets.map(sheetName => {
                const isSelected = selectedModules[sheetName];
                const cardCount = allFlashcards[sheetName].length;
                const statusIcon = isSelected ? '✓' : '○';
                
                // Check if sheet matches search
                const matchesSearch = sheetName.toLowerCase().includes(searchTerm);
                if (matchesSearch) {
                    hasVisibleModules = true;
                }

                return `
                    <div 
                        class="module-item ${isSelected ? 'selected' : ''} ${matchesSearch ? '' : 'hidden'}" 
                        data-module="${sheetName}"
                        onclick="toggleModule('${sheetName}')"
                    >
                        <div class="module-info">
                            <div class="module-name">${sheetName}</div>
                            <div class="module-count">${cardCount} cards</div>
                        </div>
                        <div class="module-status">${statusIcon}</div>
                    </div>
                `;
            }).join('');

            moduleList.innerHTML = moduleHTML || '<div class="no-results">No sheets found</div>';
        }

        // Toggle Module Selection
        function toggleModule(sheetName) {
            selectedModules[sheetName] = !selectedModules[sheetName];
            updateModuleList();
            updateSelectionCounter();
        }

        // Update Selection Counter
        function updateSelectionCounter() {
            const selectedCount = Object.values(selectedModules).filter(v => v).length;
            const totalCount = Object.keys(allFlashcards).length;
            selectionCounter.textContent = `${selectedCount} of ${totalCount} sheets selected`;
        }

        // Search Input Handler
        searchInput.addEventListener('input', () => {
            updateModuleList();
        });

        // Select All Modules
        selectAllBtn.addEventListener('click', () => {
            const searchTerm = searchInput.value.toLowerCase();
            Object.keys(allFlashcards).forEach(sheetName => {
                if (sheetName.toLowerCase().includes(searchTerm)) {
                    selectedModules[sheetName] = true;
                }
            });
            updateModuleList();
            updateSelectionCounter();
        });

        // Deselect All Modules
        deselectAllBtn.addEventListener('click', () => {
            const searchTerm = searchInput.value.toLowerCase();
            Object.keys(allFlashcards).forEach(sheetName => {
                if (sheetName.toLowerCase().includes(searchTerm)) {
                    selectedModules[sheetName] = false;
                }
            });
            updateModuleList();
            updateSelectionCounter();
        });

        // Shuffle Function
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Build Active Flashcards from Selected Sheets
        function buildActiveFlashcards() {
            activeFlashcards = [];
            const selectedSheetsList = [];

            Object.keys(allFlashcards).forEach(sheetName => {
                if (selectedModules[sheetName]) {
                    activeFlashcards.push(...allFlashcards[sheetName]);
                    selectedSheetsList.push(sheetName);
                }
            });

            activeFlashcards = shuffleArray(activeFlashcards);
            selectedModulesDisplay.textContent = `📚 Studying: ${selectedSheetsList.join(', ')}`;
        }

        // Begin Quiz
        beginButton.addEventListener('click', () => {
            const selectedCount = Object.values(selectedModules).filter(v => v).length;
            
            if (selectedCount === 0) {
                showError('Please select at least one sheet');
                return;
            }

            buildActiveFlashcards();
            currentIndex = 0;
            isFlipped = false;
            uploadSection.style.display = 'none';
            loadingSection.style.display = 'none';
            moduleSelectionSection.style.display = 'none';
            quizSection.style.display = 'block';
            updateDisplay();
        });

        // Flashcard Click to Flip
        flashcardContainer.addEventListener('click', () => {
            isFlipped = !isFlipped;
            flashcard.classList.toggle('flipped');
        });

        // Update Display
        function updateDisplay() {
            const card = activeFlashcards[currentIndex];
            frontContent.textContent = card.front;
            backContent.textContent = card.back;
            cardNumber.textContent = `Flashcard ${currentIndex + 1} of ${activeFlashcards.length}`;
            progressText.textContent = `${currentIndex + 1}/${activeFlashcards.length}`;
            progressFill.style.width = `${((currentIndex + 1) / activeFlashcards.length) * 100}%`;

            isFlipped = false;
            flashcard.classList.remove('flipped');

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === activeFlashcards.length - 1;
        }

        // Navigation
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < activeFlashcards.length - 1) {
                currentIndex++;
                updateDisplay();
            }
        });

        // Shuffle Again
        shuffleBtn.addEventListener('click', () => {
            if (activeFlashcards.length > 0) {
                activeFlashcards = shuffleArray(activeFlashcards);
                currentIndex = 0;
                isFlipped = false;
                updateDisplay();
                showSuccess('Flashcards reshuffled!');
            }
        });

        // Reset
        resetBtn.addEventListener('click', () => {
            activeFlashcards = [];
            currentIndex = 0;
            isFlipped = false;
            searchInput.value = '';
            allFlashcards = {};
            selectedModules = {};
            fileInput.value = '';
            uploadSection.style.display = 'flex';
            loadingSection.style.display = 'none';
            moduleSelectionSection.style.display = 'none';
            quizSection.style.display = 'none';
            errorMessage.classList.remove('show');
        });

        // Error Handling
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 7000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
