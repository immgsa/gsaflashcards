<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSA Flashcard Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1em;
        }

        /* Upload Section */
        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .upload-area small {
            color: #999;
            display: block;
        }

        #fileInput {
            display: none;
        }

        .file-list {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
            color: #666;
            font-size: 0.9em;
        }

        .file-list li {
            list-style: none;
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .file-list li:last-child {
            border-bottom: none;
        }

        /* Loading Screen */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 400px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #667eea;
            font-size: 1.2em;
            font-weight: 600;
        }

        /* Begin Quiz Button */
        .begin-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .begin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .begin-button:active {
            transform: translateY(0);
        }

        /* Quiz Section */
        .quiz-section {
            display: none;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-header h2 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }

        /* Flashcard */
        .flashcard-container {
            perspective: 1000px;
            margin: 40px 0;
            height: 300px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: 500;
            text-align: center;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .flashcard-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .flashcard-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .flip-hint {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.8em;
            opacity: 0.8;
            font-style: italic;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .reset-button {
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .reset-button:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .shuffle-button {
            background: #4ecdc4;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .shuffle-button:hover {
            background: #45b8ad;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .flashcard-face {
                font-size: 1.1em;
                padding: 20px;
            }

            .flashcard-container {
                height: 250px;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                width: 100%;
            }
        }

        /* Error Message */
        .error-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 GSA Flashcard Quiz</h1>
            <p>Master your knowledge with interactive flashcards</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <!-- Upload Section -->
        <div id="uploadSection" class="upload-section">
            <div id="uploadArea" class="upload-area">
                <div class="upload-icon">📁</div>
                <p>Drop your .txt files here</p>
                <small>or click to browse</small>
            </div>
            <input type="file" id="fileInput" multiple accept=".txt">
            <ul id="fileList" class="file-list"></ul>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen" class="loading-screen" style="display: none;">
            <div class="spinner"></div>
            <div class="loading-text">Processing your flashcards...</div>
        </div>

        <!-- Begin Quiz Button -->
        <div id="beginButtonContainer" style="display: none; text-align: center;">
            <button id="beginButton" class="begin-button">Begin Quiz 🚀</button>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection" class="quiz-section">
            <div class="quiz-header">
                <h2 id="cardNumber">Flashcard 1 of 1</h2>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span id="progressText">0/0</span>
                </div>
            </div>

            <div class="flashcard-container" id="flashcardContainer">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-face flashcard-front">
                        <div>
                            <div id="frontContent">Front</div>
                            <div class="flip-hint">Click to flip</div>
                        </div>
                    </div>
                    <div class="flashcard-face flashcard-back">
                        <div>
                            <div id="backContent">Back</div>
                            <div class="flip-hint">Click to flip</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="prevBtn" class="btn btn-secondary">← Previous</button>
                <button id="nextBtn" class="btn btn-secondary">Next →</button>
            </div>

            <div class="action-buttons">
                <button id="shuffleBtn" class="shuffle-button">🔀 Shuffle Again</button>
                <button id="resetBtn" class="reset-button">↻ Reset & Upload New</button>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let flashcards = [];
        let currentIndex = 0;
        let isFlipped = false;

        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const loadingScreen = document.getElementById('loadingScreen');
        const beginButtonContainer = document.getElementById('beginButtonContainer');
        const beginButton = document.getElementById('beginButton');
        const quizSection = document.getElementById('quizSection');
        const uploadSection = document.getElementById('uploadSection');
        const flashcard = document.getElementById('flashcard');
        const frontContent = document.getElementById('frontContent');
        const backContent = document.getElementById('backContent');
        const cardNumber = document.getElementById('cardNumber');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const errorMessage = document.getElementById('errorMessage');
        const flashcardContainer = document.getElementById('flashcardContainer');

        // Upload Area Click
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag & Drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.txt'));
            processFiles(files);
        });

        // File Input Change
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files).filter(f => f.name.endsWith('.txt'));
            processFiles(files);
        });

        // Shuffle Function (Fisher-Yates Algorithm)
        function shuffleArray(array) {
            const shuffled = [...array]; // Create a copy
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Process Files
        async function processFiles(files) {
            if (files.length === 0) {
                showError('Please select .txt files');
                return;
            }

            flashcards = [];
            const fileNames = [];

            for (const file of files) {
                fileNames.push(file.name);
                const text = await file.text();
                const cards = parseFlashcards(text);
                flashcards.push(...cards);
            }

            // Update file list
            fileList.innerHTML = fileNames
                .map(name => `<li>✓ ${name}</li>`)
                .join('');

            if (flashcards.length === 0) {
                showError('No valid flashcards found. Check your file format: %$front content$%,%$back content$%');
                return;
            }

            // SHUFFLE THE FLASHCARDS
            flashcards = shuffleArray(flashcards);

            // Show loading screen
            showLoadingScreen();

            // Simulate 2-second processing
            await new Promise(resolve => setTimeout(resolve, 2000));

            // Show begin button
            showBeginButton();
        }

        // Parse Flashcards with %$ $% separator
        function parseFlashcards(text) {
            const lines = text.split('\n').filter(line => line.trim());
            const cards = [];

            for (const line of lines) {
                // Match pattern: %$content$%,%$content$%
                const match = line.match(/%\$(.*?)\$%\s*,\s*%\$(.*?)\$%/);

                if (match) {
                    cards.push({
                        front: match[1].trim(),
                        back: match[2].trim()
                    });
                }
                // Fallback to comma separator if no %$ pattern found
                else if (line.includes(',')) {
                    const [front, back] = line.split(',').map(s => s.trim());
                    if (front && back) {
                        cards.push({ front, back });
                    }
                }
            }

            return cards;
        }

        // Show Loading Screen
        function showLoadingScreen() {
            uploadSection.style.display = 'none';
            loadingScreen.style.display = 'flex';
            beginButtonContainer.style.display = 'none';
            quizSection.style.display = 'none';
        }

        // Show Begin Button
        function showBeginButton() {
            loadingScreen.style.display = 'none';
            beginButtonContainer.style.display = 'block';
            quizSection.style.display = 'none';
        }

        // Begin Quiz
        beginButton.addEventListener('click', () => {
            currentIndex = 0;
            isFlipped = false;
            uploadSection.style.display = 'none';
            loadingScreen.style.display = 'none';
            beginButtonContainer.style.display = 'none';
            quizSection.style.display = 'block';
            updateDisplay();
        });

        // Flashcard Click to Flip
        flashcardContainer.addEventListener('click', () => {
            isFlipped = !isFlipped;
            flashcard.classList.toggle('flipped');
        });

        // Update Display
        function updateDisplay() {
            const card = flashcards[currentIndex];
            frontContent.textContent = card.front;
            backContent.textContent = card.back;
            cardNumber.textContent = `Flashcard ${currentIndex + 1} of ${flashcards.length}`;
            progressText.textContent = `${currentIndex + 1}/${flashcards.length}`;
            progressFill.style.width = `${((currentIndex + 1) / flashcards.length) * 100}%`;

            // Reset flip
            isFlipped = false;
            flashcard.classList.remove('flipped');

            // Update button states
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === flashcards.length - 1;
        }

        // Navigation
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateDisplay();
            }
        });

        // Shuffle Again
        shuffleBtn.addEventListener('click', () => {
            if (flashcards.length > 0) {
                flashcards = shuffleArray(flashcards);
                currentIndex = 0;
                isFlipped = false;
                updateDisplay();
            }
        });

        // Reset
        resetBtn.addEventListener('click', () => {
            flashcards = [];
            currentIndex = 0;
            isFlipped = false;
            fileList.innerHTML = '';
            fileInput.value = '';
            uploadSection.style.display = 'flex';
            quizSection.style.display = 'none';
            beginButtonContainer.style.display = 'none';
            errorMessage.classList.remove('show');
        });

        // Error Handling
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
