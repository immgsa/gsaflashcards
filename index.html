<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSA Flashcard Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1em;
        }

        /* Loading Section */
        .loading-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 400px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #667eea;
            font-size: 1.2em;
            font-weight: 600;
        }

        /* Begin Quiz Button */
        .begin-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .begin-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .begin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .begin-button:active {
            transform: translateY(0);
        }

        /* Module Selection */
        .module-selection {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .module-selection h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-input::placeholder {
            color: #999;
        }

        /* Module List */
        .module-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        /* Scrollbar Styling */
        .module-list::-webkit-scrollbar {
            width: 8px;
        }

        .module-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .module-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .module-list::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .module-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
        }

        .module-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .module-item.selected {
            border-color: #4ecdc4;
            background: #e8f9f7;
        }

        .module-item.hidden {
            display: none;
        }

        .module-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .module-name {
            color: #333;
            font-weight: 600;
            font-size: 1em;
        }

        .module-count {
            color: #999;
            font-size: 0.85em;
        }

        .module-status {
            font-size: 1.5em;
            transition: all 0.2s ease;
            min-width: 40px;
            text-align: right;
        }

        .module-item:hover .module-status {
            transform: scale(1.15);
        }

        /* Select All Buttons */
        .select-all-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .select-btn {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .select-all-btn {
            background: #4ecdc4;
            color: white;
        }

        .select-all-btn:hover {
            background: #45b8ad;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.3);
        }

        .deselect-all-btn {
            background: #ff6b6b;
            color: white;
        }

        .deselect-all-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .selection-counter {
            text-align: center;
            color: #667eea;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Quiz Section */
        .quiz-section {
            display: none;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-header h2 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .selected-modules {
            color: #999;
            font-size: 0.85em;
            margin-top: 10px;
            max-height: 60px;
            overflow-y: auto;
            background: #f8f9ff;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }

        /* Flashcard */
        .flashcard-container {
            perspective: 1000px;
            margin: 40px 0;
            height: 300px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: 500;
            text-align: center;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            word-wrap: break-word;
            overflow-y: auto;
        }

        .flashcard-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .flashcard-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .flip-hint {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.8em;
            opacity: 0.8;
            font-style: italic;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .reset-button {
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .reset-button:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .shuffle-button {
            background: #4ecdc4;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .shuffle-button:hover {
            background: #45b8ad;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .flashcard-face {
                font-size: 1.1em;
                padding: 20px;
            }

            .flashcard-container {
                height: 250px;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                width: 100%;
            }

            .module-item {
                flex-wrap: wrap;
            }

            .module-list {
                max-height: 300px;
            }
        }

        /* Error Message */
        .error-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 GSA Flashcard Quiz</h1>
            <p>Master your knowledge with interactive flashcards</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Loading Section -->
        <div id="loadingSection" class="loading-section">
            <div class="spinner"></div>
            <div class="loading-text">Loading your flashcards...</div>
        </div>

        <!-- Module Selection Section -->
        <div id="moduleSelectionSection" style="display: none;">
            <div class="module-selection">
                <h3>📚 Select Modules to Study</h3>
                
                <!-- Search Bar -->
                <div class="search-container">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="🔍 Search modules..."
                    >
                </div>

                <!-- Selection Counter -->
                <div class="selection-counter" id="selectionCounter">0 modules selected</div>

                <!-- Select/Deselect All Buttons -->
                <div class="select-all-buttons">
                    <button class="select-btn select-all-btn" id="selectAllBtn">✓ Select All</button>
                    <button class="select-btn deselect-all-btn" id="deselectAllBtn">✗ Deselect All</button>
                </div>

                <!-- Module List -->
                <div class="module-list" id="moduleList">
                    <div class="no-results">Loading modules...</div>
                </div>
            </div>

            <div style="text-align: center;">
                <button id="beginButton" class="begin-button">Begin Quiz 🚀</button>
            </div>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection" class="quiz-section">
            <div class="quiz-header">
                <h2 id="cardNumber">Flashcard 1 of 1</h2>
                <div class="selected-modules" id="selectedModulesDisplay"></div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span id="progressText">0/0</span>
                </div>
            </div>

            <div class="flashcard-container" id="flashcardContainer">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-face flashcard-front">
                        <div>
                            <div id="frontContent">Front</div>
                            <div class="flip-hint">Click to flip</div>
                        </div>
                    </div>
                    <div class="flashcard-face flashcard-back">
                        <div>
                            <div id="backContent">Back</div>
                            <div class="flip-hint">Click to flip</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="prevBtn" class="btn btn-secondary">← Previous</button>
                <button id="nextBtn" class="btn btn-secondary">Next →</button>
            </div>

            <div class="action-buttons">
                <button id="shuffleBtn" class="shuffle-button">🔀 Shuffle Again</button>
                <button id="resetBtn" class="reset-button">↻ Reset & Select Modules</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration - UPDATE THESE WITH YOUR GITHUB INFO
        const GITHUB_USERNAME = 'immgsa';
        const REPO_NAME = 'gsaflashcards';
        const CONTENT_FOLDER = 'content';

        // State Management
        let allFlashcards = {};
        let selectedModules = {};
        let activeFlashcards = [];
        let currentIndex = 0;
        let isFlipped = false;

        // DOM Elements
        const loadingSection = document.getElementById('loadingSection');
        const moduleSelectionSection = document.getElementById('moduleSelectionSection');
        const moduleList = document.getElementById('moduleList');
        const searchInput = document.getElementById('searchInput');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        const selectionCounter = document.getElementById('selectionCounter');
        const beginButton = document.getElementById('beginButton');
        const quizSection = document.getElementById('quizSection');
        const flashcard = document.getElementById('flashcard');
        const frontContent = document.getElementById('frontContent');
        const backContent = document.getElementById('backContent');
        const cardNumber = document.getElementById('cardNumber');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const selectedModulesDisplay = document.getElementById('selectedModulesDisplay');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const flashcardContainer = document.getElementById('flashcardContainer');

        // Initialize - Auto-load files on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadFlashcardsFromGitHub();
        });

        // Load Files from GitHub
        async function loadFlashcardsFromGitHub() {
            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${CONTENT_FOLDER}`;
                
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`Failed to fetch files: ${response.status}`);
                }

                const files = await response.json();

                if (!Array.isArray(files)) {
                    throw new Error('No files found in content folder');
                }

                const txtFiles = files.filter(file => file.name.endsWith('.txt'));

                if (txtFiles.length === 0) {
                    throw new Error('No .txt files found in content folder');
                }

                allFlashcards = {};
                selectedModules = {};

                for (const file of txtFiles) {
                    const moduleName = file.name.replace('.txt', '');
                    const fileContent = await fetch(file.download_url);
                    const text = await fileContent.text();
                    const cards = parseFlashcards(text);
                    
                    if (cards.length > 0) {
                        allFlashcards[moduleName] = cards;
                        selectedModules[moduleName] = true;
                    }
                }

                if (Object.keys(allFlashcards).length === 0) {
                    throw new Error('No valid flashcards found. Check your file format.');
                }

                showModuleSelection();

            } catch (error) {
                showError(`Error loading flashcards: ${error.message}`);
                console.error('Full error:', error);
            }
        }

        // Parse Flashcards
        function parseFlashcards(text) {
            const lines = text.split('\n').filter(line => line.trim());
            const cards = [];

            for (const line of lines) {
                const match = line.match(/%\$(.*?)\$%\s*,\s*%\$(.*?)\$%/);

                if (match) {
                    cards.push({
                        front: match[1].trim(),
                        back: match[2].trim()
                    });
                }
                else if (line.includes(',')) {
                    const [front, back] = line.split(',').map(s => s.trim());
                    if (front && back) {
                        cards.push({ front, back });
                    }
                }
            }

            return cards;
        }

        // Show Module Selection
        function showModuleSelection() {
            loadingSection.style.display = 'none';
            moduleSelectionSection.style.display = 'block';
            quizSection.style.display = 'none';
            updateModuleList();
            updateSelectionCounter();
        }

        // Update Module List Display
        function updateModuleList() {
            const searchTerm = searchInput.value.toLowerCase();
            const modules = Object.keys(allFlashcards);
            let hasVisibleModules = false;

            const moduleHTML = modules.map(moduleName => {
                const isSelected = selectedModules[moduleName];
                const cardCount = allFlashcards[moduleName].length;
                const statusIcon = isSelected ? '✓' : '○';
                
                // Check if module matches search
                const matchesSearch = moduleName.toLowerCase().includes(searchTerm);
                if (matchesSearch) {
                    hasVisibleModules = true;
                }

                return `
                    <div 
                        class="module-item ${isSelected ? 'selected' : ''} ${matchesSearch ? '' : 'hidden'}" 
                        data-module="${moduleName}"
                        onclick="toggleModule('${moduleName}')"
                    >
                        <div class="module-info">
                            <div class="module-name">${moduleName}</div>
                            <div class="module-count">${cardCount} cards</div>
                        </div>
                        <div class="module-status">${statusIcon}</div>
                    </div>
                `;
            }).join('');

            moduleList.innerHTML = moduleHTML || '<div class="no-results">No modules found</div>';
        }

        // Toggle Module Selection
        function toggleModule(moduleName) {
            selectedModules[moduleName] = !selectedModules[moduleName];
            updateModuleList();
            updateSelectionCounter();
        }

        // Update Selection Counter
        function updateSelectionCounter() {
            const selectedCount = Object.values(selectedModules).filter(v => v).length;
            const totalCount = Object.keys(allFlashcards).length;
            selectionCounter.textContent = `${selectedCount} of ${totalCount} modules selected`;
        }

        // Search Input Handler
        searchInput.addEventListener('input', () => {
            updateModuleList();
        });

        // Select All Modules
        selectAllBtn.addEventListener('click', () => {
            const searchTerm = searchInput.value.toLowerCase();
            Object.keys(allFlashcards).forEach(moduleName => {
                if (moduleName.toLowerCase().includes(searchTerm)) {
                    selectedModules[moduleName] = true;
                }
            });
            updateModuleList();
            updateSelectionCounter();
        });

        // Deselect All Modules
        deselectAllBtn.addEventListener('click', () => {
            const searchTerm = searchInput.value.toLowerCase();
            Object.keys(allFlashcards).forEach(moduleName => {
                if (moduleName.toLowerCase().includes(searchTerm)) {
                    selectedModules[moduleName] = false;
                }
            });
            updateModuleList();
            updateSelectionCounter();
        });

        // Shuffle Function
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Build Active Flashcards from Selected Modules
        function buildActiveFlashcards() {
            activeFlashcards = [];
            const selectedModulesList = [];

            Object.keys(allFlashcards).forEach(moduleName => {
                if (selectedModules[moduleName]) {
                    activeFlashcards.push(...allFlashcards[moduleName]);
                    selectedModulesList.push(moduleName);
                }
            });

            activeFlashcards = shuffleArray(activeFlashcards);
            selectedModulesDisplay.textContent = `📚 Studying: ${selectedModulesList.join(', ')}`;
        }

        // Begin Quiz
        beginButton.addEventListener('click', () => {
            const selectedCount = Object.values(selectedModules).filter(v => v).length;
            
            if (selectedCount === 0) {
                showError('Please select at least one module');
                return;
            }

            buildActiveFlashcards();
            currentIndex = 0;
            isFlipped = false;
            loadingSection.style.display = 'none';
            moduleSelectionSection.style.display = 'none';
            quizSection.style.display = 'block';
            updateDisplay();
        });

        // Flashcard Click to Flip
        flashcardContainer.addEventListener('click', () => {
            isFlipped = !isFlipped;
            flashcard.classList.toggle('flipped');
        });

        // Update Display
        function updateDisplay() {
            const card = activeFlashcards[currentIndex];
            frontContent.textContent = card.front;
            backContent.textContent = card.back;
            cardNumber.textContent = `Flashcard ${currentIndex + 1} of ${activeFlashcards.length}`;
            progressText.textContent = `${currentIndex + 1}/${activeFlashcards.length}`;
            progressFill.style.width = `${((currentIndex + 1) / activeFlashcards.length) * 100}%`;

            isFlipped = false;
            flashcard.classList.remove('flipped');

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === activeFlashcards.length - 1;
        }

        // Navigation
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < activeFlashcards.length - 1) {
                currentIndex++;
                updateDisplay();
            }
        });

        // Shuffle Again
        shuffleBtn.addEventListener('click', () => {
            if (activeFlashcards.length > 0) {
                activeFlashcards = shuffleArray(activeFlashcards);
                currentIndex = 0;
                isFlipped = false;
                updateDisplay();
                showSuccess('Flashcards reshuffled!');
            }
        });

        // Reset
        resetBtn.addEventListener('click', () => {
            activeFlashcards = [];
            currentIndex = 0;
            isFlipped = false;
            searchInput.value = '';
            loadingSection.style.display = 'none';
            moduleSelectionSection.style.display = 'block';
            quizSection.style.display = 'none';
            errorMessage.classList.remove('show');
            updateModuleList();
        });

        // Error Handling
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 7000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
