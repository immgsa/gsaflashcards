<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSA Flashcard Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1em;
        }

        /* Loading Section */
        .loading-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 400px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #667eea;
            font-size: 1.2em;
            font-weight: 600;
        }

        /* Begin Quiz Button */
        .begin-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .begin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .begin-button:active {
            transform: translateY(0);
        }

        /* File List */
        .file-list {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-list h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .file-list ul {
            list-style: none;
        }

        .file-list li {
            padding: 8px 0;
            color: #666;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-list li:last-child {
            border-bottom: none;
        }

        .file-list li:before {
            content: "✓";
            color: #4ecdc4;
            font-weight: bold;
        }

        /* Quiz Section */
        .quiz-section {
            display: none;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-header h2 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }

        /* Flashcard */
        .flashcard-container {
            perspective: 1000px;
            margin: 40px 0;
            height: 300px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: 500;
            text-align: center;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .flashcard-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .flashcard-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .flip-hint {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.8em;
            opacity: 0.8;
            font-style: italic;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .reset-button {
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .reset-button:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .shuffle-button {
            background: #4ecdc4;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .shuffle-button:hover {
            background: #45b8ad;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .flashcard-face {
                font-size: 1.1em;
                padding: 20px;
            }

            .flashcard-container {
                height: 250px;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                width: 100%;
            }
        }

        /* Error Message */
        .error-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 GSA Flashcard Quiz</h1>
            <p>Master your knowledge with interactive flashcards</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Loading Section -->
        <div id="loadingSection" class="loading-section">
            <div class="spinner"></div>
            <div class="loading-text">Loading your flashcards...</div>
        </div>

        <!-- File List -->
        <div id="fileListSection" style="display: none;">
            <div class="file-list">
                <h3>📄 Loaded Files</h3>
                <ul id="fileListUL"></ul>
            </div>
        </div>

        <!-- Begin Quiz Button -->
        <div id="beginButtonContainer" style="display: none; text-align: center;">
            <button id="beginButton" class="begin-button">Begin Quiz 🚀</button>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection" class="quiz-section">
            <div class="quiz-header">
                <h2 id="cardNumber">Flashcard 1 of 1</h2>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span id="progressText">0/0</span>
                </div>
            </div>

            <div class="flashcard-container" id="flashcardContainer">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-face flashcard-front">
                        <div>
                            <div id="frontContent">Front</div>
                            <div class="flip-hint">Click to flip</div>
                        </div>
                    </div>
                    <div class="flashcard-face flashcard-back">
                        <div>
                            <div id="backContent">Back</div>
                            <div class="flip-hint">Click to flip</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="prevBtn" class="btn btn-secondary">← Previous</button>
                <button id="nextBtn" class="btn btn-secondary">Next →</button>
            </div>

            <div class="action-buttons">
                <button id="shuffleBtn" class="shuffle-button">🔀 Shuffle Again</button>
                <button id="resetBtn" class="reset-button">↻ Reset & Reload</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration - UPDATE THESE WITH YOUR GITHUB INFO
        const GITHUB_USERNAME = 'immgsa'; // Replace with your GitHub username
        const REPO_NAME = 'gsaflashcards'; // Replace with your repo name
        const CONTENT_FOLDER = 'content'; // Folder containing .txt files

        // State Management
        let flashcards = [];
        let currentIndex = 0;
        let isFlipped = false;
        let loadedFiles = [];

        // DOM Elements
        const loadingSection = document.getElementById('loadingSection');
        const fileListSection = document.getElementById('fileListSection');
        const fileListUL = document.getElementById('fileListUL');
        const beginButtonContainer = document.getElementById('beginButtonContainer');
        const beginButton = document.getElementById('beginButton');
        const quizSection = document.getElementById('quizSection');
        const flashcard = document.getElementById('flashcard');
        const frontContent = document.getElementById('frontContent');
        const backContent = document.getElementById('backContent');
        const cardNumber = document.getElementById('cardNumber');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const flashcardContainer = document.getElementById('flashcardContainer');

        // Initialize - Auto-load files on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadFlashcardsFromGitHub();
        });

        // Load Files from GitHub
        async function loadFlashcardsFromGitHub() {
            try {
                // First, get the list of files in the content folder
                const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${CONTENT_FOLDER}`;
                
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`Failed to fetch files: ${response.status}`);
                }

                const files = await response.json();

                if (!Array.isArray(files)) {
                    throw new Error('No files found in content folder');
                }

                // Filter for .txt files
                const txtFiles = files.filter(file => file.name.endsWith('.txt'));

                if (txtFiles.length === 0) {
                    throw new Error('No .txt files found in content folder');
                }

                // Load each .txt file
                flashcards = [];
                loadedFiles = [];

                for (const file of txtFiles) {
                    const fileContent = await fetch(file.download_url);
                    const text = await fileContent.text();
                    const cards = parseFlashcards(text);
                    flashcards.push(...cards);
                    loadedFiles.push(file.name);
                }

                if (flashcards.length === 0) {
                    throw new Error('No valid flashcards found. Check your file format.');
                }

                // Shuffle the flashcards
                flashcards = shuffleArray(flashcards);

                // Update UI
                updateFileList();
                showBeginButton();

            } catch (error) {
                showError(`Error loading flashcards: ${error.message}`);
                console.error('Full error:', error);
            }
        }

        // Shuffle Function (Fisher-Yates Algorithm)
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Parse Flashcards
        function parseFlashcards(text) {
            const lines = text.split('\n').filter(line => line.trim());
            const cards = [];

            for (const line of lines) {
                // Match pattern: %$content$%,%$content$%
                const match = line.match(/%\$(.*?)\$%\s*,\s*%\$(.*?)\$%/);

                if (match) {
                    cards.push({
                        front: match[1].trim(),
                        back: match[2].trim()
                    });
                }
                // Fallback to comma separator
                else if (line.includes(',')) {
                    const [front, back] = line.split(',').map(s => s.trim());
                    if (front && back) {
                        cards.push({ front, back });
                    }
                }
            }

            return cards;
        }

        // Update File List Display
        function updateFileList() {
            fileListUL.innerHTML = loadedFiles
                .map(name => `<li>${name}</li>`)
                .join('');
        }

        // Show Begin Button
        function showBeginButton() {
            loadingSection.style.display = 'none';
            fileListSection.style.display = 'block';
            beginButtonContainer.style.display = 'block';
            quizSection.style.display = 'none';
        }

        // Begin Quiz
        beginButton.addEventListener('click', () => {
            currentIndex = 0;
            isFlipped = false;
            loadingSection.style.display = 'none';
            fileListSection.style.display = 'none';
            beginButtonContainer.style.display = 'none';
            quizSection.style.display = 'block';
            updateDisplay();
        });

        // Flashcard Click to Flip
        flashcardContainer.addEventListener('click', () => {
            isFlipped = !isFlipped;
            flashcard.classList.toggle('flipped');
        });

        // Update Display
        function updateDisplay() {
            const card = flashcards[currentIndex];
            frontContent.textContent = card.front;
            backContent.textContent = card.back;
            cardNumber.textContent = `Flashcard ${currentIndex + 1} of ${flashcards.length}`;
            progressText.textContent = `${currentIndex + 1}/${flashcards.length}`;
            progressFill.style.width = `${((currentIndex + 1) / flashcards.length) * 100}%`;

            // Reset flip
            isFlipped = false;
            flashcard.classList.remove('flipped');

            // Update button states
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === flashcards.length - 1;
        }

        // Navigation
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateDisplay();
            }
        });

        // Shuffle Again
        shuffleBtn.addEventListener('click', () => {
            if (flashcards.length > 0) {
                flashcards = shuffleArray(flashcards);
                currentIndex = 0;
                isFlipped = false;
                updateDisplay();
                showSuccess('Flashcards reshuffled!');
            }
        });

        // Reset
        resetBtn.addEventListener('click', () => {
            flashcards = [];
            currentIndex = 0;
            isFlipped = false;
            loadedFiles = [];
            loadingSection.style.display = 'flex';
            fileListSection.style.display = 'none';
            beginButtonContainer.style.display = 'none';
            quizSection.style.display = 'none';
            errorMessage.classList.remove('show');
            loadFlashcardsFromGitHub();
        });

        // Error Handling
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            loadingSection.style.display = 'none';
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 7000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
